<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Little Surprise ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
margin:0;font-family:Poppins,sans-serif;overflow:hidden;
background:linear-gradient(135deg,#ff9ec4,#ffd6e7,#cbb4ff);
display:flex;justify-content:center;align-items:center;height:100vh;color:#fff}
body:before{
content:"";position:fixed;inset:0;
background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.25),transparent 30%),
radial-gradient(circle at 80% 70%,rgba(255,255,255,.2),transparent 30%);
animation:floatbg 8s ease-in-out infinite alternate}
@keyframes floatbg{to{transform:scale(1.08) translateY(-10px)}}
.card{
position:relative;z-index:2;
width:min(92vw,430px);
padding:28px;border-radius:28px;
background:rgba(255,255,255,.18);
backdrop-filter:blur(18px);
box-shadow:0 15px 40px rgba(0,0,0,.18);
text-align:center}
h1{font-family:"Great Vibes",cursive;font-size:52px;margin:5px 0 10px}
p{margin:8px 0}
.hint{opacity:.9}
.boxes{display:flex;gap:8px;justify-content:center;margin:20px 0}
.boxes input{
width:42px;height:52px;border:none;border-radius:12px;
font-size:24px;text-align:center;text-transform:uppercase}
button{
border:none;border-radius:999px;padding:13px 34px;
background:#ff4f8b;color:#fff;font-size:17px;font-weight:700;
cursor:pointer;transition:.25s}
button:hover{transform:scale(1.05)}
#msg{height:24px;margin-top:12px}
#main{display:none}
video{width:100%;border-radius:20px;box-shadow:0 0 25px rgba(255,255,255,.45)}
#hearts span{
position:fixed;bottom:-30px;font-size:20px;
animation:rise linear infinite;color:#fff8}
@keyframes rise{
from{transform:translateY(0)}to{transform:translateY(-120vh) rotate(360deg)}
}
.end{margin-top:18px;font-size:15px}
</style>
</head>
<body>
<div id="hearts"></div>

<div class="card" id="lock">
<h1>A Little Surprise</h1>
<p>Only one person can unlock this. ❤️</p>
<p class="hint"><b>Hint:</b> you❤️‍🩹</p>

<div class="boxes">
<input maxlength=1><input maxlength=1><input maxlength=1><input maxlength=1><input maxlength=1><input maxlength=1><input maxlength=1>
</div>

<button onclick="unlock()">Unlock ❤️</button>
<div id="msg"></div>
</div>

<div class="card" id="main">
<h1>Welcome Anjana ❤️</h1>
<p>You found the key to my heart...</p>
<video controls autoplay>
<source src="video.mp4" type="video/mp4">
</video>
<div class="end">
<h2 style="font-family:Great Vibes;font-size:40px;margin:10px 0;">Happy Girlfriend's Day ❤️</h2>
<p>Every smile of yours is my favourite memory. Thank you for being my safest place and my happiest chapter. I love you. 🌹</p>
</div>
</div>

<script>
const hearts=document.getElementById("hearts");
for(let i=0;i<28;i++){
 let s=document.createElement("span");
 s.textContent="❤";
 s.style.left=Math.random()*100+"vw";
 s.style.animationDuration=(6+Math.random()*8)+"s";
 s.style.animationDelay=(-Math.random()*10)+"s";
 hearts.appendChild(s);
}
const ins=document.querySelectorAll("input");
ins.forEach((e,i)=>{
 e.oninput=()=>{
  e.value=e.value.toUpperCase();
  if(e.value&&i<6)ins[i+1].focus();
 };
 e.onkeydown=(k)=>{if(k.key==="Backspace"&&!e.value&&i>0)ins[i-1].focus();}
});
function unlock(){
 let p="";
 ins.forEach(i=>p+=i.value);
 if(p==="KALYANI"){
   document.getElementById("lock").style.display="none";
   document.getElementById("main").style.display="block";
 }else{
   document.getElementById("msg").innerHTML="💔 Not quite... Think with your heart.";
 }
}
</script>
</body>
</html>
