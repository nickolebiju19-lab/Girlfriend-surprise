<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffdde1,#ee9ca7);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
color:white;
}

.container{
background:rgba(255,255,255,0.15);
padding:30px;
border-radius:20px;
backdrop-filter:blur(10px);
width:90%;
max-width:400px;
}

.boxes{
display:flex;
justify-content:center;
gap:8px;
margin:20px 0;
}

.boxes input{
width:40px;
height:50px;
font-size:24px;
text-align:center;
border:none;
border-radius:10px;
outline:none;
text-transform:uppercase;
}

button{
padding:12px 30px;
border:none;
border-radius:30px;
background:#ff4d6d;
color:white;
font-size:18px;
cursor:pointer;
}

#message{
margin-top:15px;
font-weight:bold;
}

#videoPage{
display:none;
}

video{
width:90%;
max-width:700px;
border-radius:20px;
margin-top:20px;
}
</style>
</head>

<body>

<div class="container" id="lockPage">
<h1>❤️ A Little Surprise ❤️</h1>

<p>Only one person can unlock this.</p>

<p><b>Hint:</b> you❤️‍🩹</p>

<div class="boxes">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
<input maxlength="1">
</div>

<button onclick="check()">Unlock ❤️</button>

<p id="message"></p>

</div>

<div id="videoPage">

<h1>❤️ Welcome Anjana ❤️</h1>

<p>You found the key to my heart...</p>

<video controls autoplay>
<source src="https://drive.google.com/file/d/1tk3DZSsgE7fTRkPsvbfK1ds5kJTm7KBs/view?usp=drivesdk" type="video/mp4">
</video>

<p style="margin-top:20px;font-size:20px;">
Happy Girlfriend's Day ❤️<br><br>
Thank you for being my favorite person.
</p>

</div>

<script>

const inputs=document.querySelectorAll("input");

inputs.forEach((input,index)=>{
input.addEventListener("input",()=>{
input.value=input.value.toUpperCase();
if(input.value && index<6){
inputs[index+1].focus();
}
});
});

function check(){

let password="";

inputs.forEach(i=>password+=i.value);

if(password.toUpperCase()=="KALYANI"){

document.getElementById("lockPage").style.display="none";
document.getElementById("videoPage").style.display="block";

}
else{

document.getElementById("message").innerHTML="❌ Oops... Think with your heart ❤️";

}

}

</script>

</body>
</html>
